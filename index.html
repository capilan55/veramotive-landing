<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veramotive | Coming Soon</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --accent-glow: rgba(59, 130, 246, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .background-accent {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            padding: 40px;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .parent-entity {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            font-weight: 400;
        }

        h1 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 3rem;
        }

        .btn {
            display: inline-block;
            padding: 14px 36px;
            background-color: var(--text-primary);
            color: var(--bg-color);
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            border: 1px solid var(--text-primary);
        }

        .btn:hover {
            background-color: transparent;
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .footer {
            position: absolute;
            bottom: 40px;
            font-size: 0.75rem;
            color: #3f3f46;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="background-accent"></div>
    
    <div class="container">
        <div class="logo">VERAMOTIVE</div>
        <div class="parent-entity">Technologies Corp.</div>
        
        <h1>Under Construction</h1>
        <p>Advanced garage administration and automotive diagnostic utilities. Our main platform is currently in development.</p>
        
        <a href="https://app.veramotive.com" class="btn">ACCESS BETA APPLICATION</a>
    </div>

    <div class="footer">
        &copy; 2026 VERAMOTIVE TECHNOLOGIES CORP. ALL RIGHTS RESERVED.
    </div>
</body>
</html>
